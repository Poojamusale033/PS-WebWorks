<section class="services">
  <div class="container">
    <div class="services-header">
      <h1>My Services</h1>
      <p>Comprehensive web development services to bring your digital ideas to life</p>
    </div>

    <div class="services-grid">
      <div class="service-card" *ngFor="let service of services">
        <div class="service-icon">{{ service.icon }}</div>
        <h3>{{ service.title }}</h3>
        <p class="service-description">{{ service.description }}</p>
        <ul class="service-features">
          <li *ngFor="let feature of service.features">{{ feature }}</li>
        </ul>
        <button class="btn btn-outline">Learn More</button>
      </div>
    </div>

    <div class="cta-section">
      <h2>Ready to Start Your Project?</h2>
      <p>Let's work together to create something amazing for your business</p>
      <button class="btn btn-primary" routerLink="/contact">Get Started Today</button>
    </div>
  </div>
</section>
